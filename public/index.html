<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRIMSON AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #050505;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* Écran d'animation d'entrée avec Robot */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOutSplash 1s forwards 2.6s;
    }

    .robot-avatar {
      width: 100px;
      height: 100px;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 15px rgba(220, 20, 60, 0.8));
      animation: floatRobot 2s ease-in-out infinite alternate;
    }

    @keyframes floatRobot {
      from { transform: translateY(0px) scale(0.98); }
      to { transform: translateY(-10px) scale(1.02); }
    }

    .splash-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #dc143c;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(220, 20, 60, 0.8);
      animation: pulseGlow 1.2s infinite alternate;
    }

    .splash-sub {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 3px;
    }

    @keyframes pulseGlow {
      from { transform: scale(0.98); opacity: 0.8; }
      to { transform: scale(1.03); opacity: 1; text-shadow: 0 0 30px rgba(220, 20, 60, 1); }
    }

    @keyframes fadeOutSplash {
      to { opacity: 0; visibility: hidden; }
    }

    /* Structure Principale */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    header {
      background: linear-gradient(180deg, #120303 0%, #050505 100%);
      padding: 14px 18px;
      text-align: center;
      border-bottom: 1px solid #2a0808;
      box-shadow: 0 4px 20px rgba(220, 20, 60, 0.15);
      flex-shrink: 0;
    }

    header h1 {
      color: #dc143c;
      font-size: 1.3rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
    }

    header p {
      font-size: 0.72rem;
      color: #777;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-wrap: break-word;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #7a0000 0%, #b30000 100%);
      color: #ffffff;
      border-bottom-right-radius: 2px;
      box-shadow: 0 3px 12px rgba(179, 0, 0, 0.3);
    }

    .ai {
      align-self: flex-start;
      background-color: #121212;
      color: #e0e0e0;
      border: 1px solid #262626;
      border-left: 3px solid #dc143c;
      border-bottom-left-radius: 2px;
    }

    .error-msg {
      align-self: center;
      background-color: rgba(220, 20, 60, 0.1);
      border: 1px solid #dc143c;
      color: #ff6b6b;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    /* Zone de Saisie Fixe */
    #input-container {
      padding: 12px 14px;
      background-color: #0d0d0d;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    #prompt {
      flex: 1;
      background-color: #161616;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    #prompt:focus {
      border-color: #dc143c;
    }

    button {
      background: linear-gradient(135deg, #8b0000 0%, #dc143c 100%);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 3px 10px rgba(220, 20, 60, 0.3);
      flex-shrink: 0;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #chat-container::-webkit-scrollbar {
      width: 4px;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background-color: #333;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Écran d'Entrée avec Robot Cyberpunk -->
  <div id="splash-screen">
    <svg class="robot-avatar" viewBox="0 0 24 24" fill="none" stroke="#dc143c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2" />
      <circle cx="12" cy="5" r="2" />
      <path d="M12 7v4" />
      <line x1="8" y1="15" x2="8" y2="15.01" stroke-width="3" />
      <line x1="16" y1="15" x2="16" y2="15.01" stroke-width="3" />
      <path d="M9 18h6" />
    </svg>
    <div class="splash-title">CRIMSON AI</div>
    <div class="splash-sub">INITIALISATION DU SYSTEME...</div>
  </div>

  <div id="app-container">
    <header>
      <h1>CRIMSON AI</h1>
      <p>CONSEILLER TACTIQUE // NON FILTRÉ</p>
    </header>

    <div id="chat-container">
      <div class="message ai">Montre-moi ce que tu vaux, Brayan. Ne me fais pas perdre mon temps.</div>
    </div>

    <div id="input-container">
      <input type="text" id="prompt" placeholder="Pose ta question..." autocomplete="off" onkeydown="if(event.key==='Enter') sendPrompt()">
      <button id="send-btn" onclick="sendPrompt()">Envoyer</button>
    </div>
  </div>

  <script>
    async function sendPrompt() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('send-btn');
      const chat = document.getElementById('chat-container');
      const text = input.value.trim();

      if (!text) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.textContent = text;
      chat.appendChild(userDiv);

      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai';
      loadingDiv.textContent = 'Analyse en cours...';
      chat.appendChild(loadingDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        
        loadingDiv.textContent = data.reply || "Tch. Aucune donnée exploitable.";
      } catch (err) {
        loadingDiv.className = 'message error-msg';
        loadingDiv.textContent = "Erreur système. Connexion interrompue.";
      } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>
</body>
</html>
