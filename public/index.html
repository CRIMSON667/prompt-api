<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIMSON AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: linear-gradient(180deg, #1a0505 0%, #0d0d0d 100%);
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #330a0a;
      box-shadow: 0 4px 15px rgba(220, 20, 60, 0.15);
    }

    header h1 {
      color: #dc143c;
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(220, 20, 60, 0.5);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.45;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b0000 0%, #dc143c 100%);
      color: #ffffff;
      border-bottom-right-radius: 2px;
      box-shadow: 0 3px 10px rgba(220, 20, 60, 0.25);
    }

    .ai {
      align-self: flex-start;
      background-color: #181818;
      color: #d1d1d1;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 2px;
    }

    .error-msg {
      align-self: center;
      background-color: rgba(220, 20, 60, 0.1);
      border: 1px solid #dc143c;
      color: #ff6b6b;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    #input-container {
      padding: 16px;
      background-color: #121212;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
    }

    #prompt {
      flex: 1;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 12px 18px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #prompt:focus {
      border-color: #dc143c;
    }

    button {
      background: linear-gradient(135deg, #8b0000 0%, #dc143c 100%);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 3px 10px rgba(220, 20, 60, 0.3);
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Custom scrollbar */
    #chat-container::-webkit-scrollbar {
      width: 6px;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background-color: #222;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <header>
    <h1>CRIMSON AI</h1>
  </header>

  <div id="chat-container">
    <div class="message ai">CRIMSON AI opérationnel. Qu'est-ce qu'on teste aujourd'hui ?</div>
  </div>

  <div id="input-container">
    <input type="text" id="prompt" placeholder="Pose une question..." onkeydown="if(event.key==='Enter') sendPrompt()">
    <button id="send-btn" onclick="sendPrompt()">Envoyer</button>
  </div>

  <script>
    async function sendPrompt() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('send-btn');
      const chat = document.getElementById('chat-container');
      const text = input.value.trim();

      if (!text) return;

      // Afficher le message utilisateur
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.textContent = text;
      chat.appendChild(userDiv);

      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      // Indicator de chargement
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai';
      loadingDiv.textContent = 'Analyse en cours...';
      chat.appendChild(loadingDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        
        loadingDiv.textContent = data.reply || "Aucune réponse reçue.";
      } catch (err) {
        loadingDiv.className = 'message error-msg';
        loadingDiv.textContent = "Erreur de connexion au serveur.";
      } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>
</body>
</html>
