<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRIMSON AI</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #0f0203; border-bottom: 1px solid #330000; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .menu-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 4px; }
    header h1 { color: #ff1e27; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; }

    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; }
    #sidebar-overlay.active { display: block; }
    
    #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0a0a0a; border-right: 1px solid #222; z-index: 201; transition: left 0.25s ease-out; display: flex; flex-direction: column; padding: 16px 12px; }
    #sidebar.active { left: 0; }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
    .sidebar-title { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .close-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }

    .menu-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #ddd; font-size: 0.9rem; cursor: pointer; }
    .menu-item:active { background: #1a1a1a; }
    .menu-icon { font-size: 1.1rem; width: 20px; text-align: center; color: #aaa; }

    .section-title { font-size: 0.75rem; color: #666; text-transform: uppercase; font-weight: bold; margin: 12px 12px 6px; }

    .recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .recent-item { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

    .sidebar-footer { border-top: 1px solid #1f1f1f; padding-top: 12px; margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ff1e27; border: 1px solid #ff1e27; font-size: 0.8rem; }
    .user-name { font-size: 0.88rem; font-weight: 600; color: #eee; }

    #chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }

    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.92rem; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background: #990000; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #141414; border: 1px solid #2a0808; color: #ddd; border-bottom-left-radius: 2px; }

    #input-area { background: #0f0203; padding: 10px; border-top: 1px solid #220000; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    #prompt-input { flex: 1; background: #121212; border: 1px solid #330000; border-radius: 20px; padding: 10px 14px; color: #fff; outline: none; font-size: 0.9rem; }
    #send-btn { background: #cc0000; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CRIMSON</span>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="menu-list">
      <div class="menu-item" onclick="newChat()">
        <span class="menu-icon">✏️</span>
        <span>Nouvelle discussion</span>
      </div>
    </div>

    <div class="section-title">Récents</div>
    <div class="recents-list" id="recents-container"></div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">BS</div>
        <span class="user-name">Brayan Slyde</span>
      </div>
    </div>
  </div>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h1>CRIMSON AI</h1>
    <div style="width: 24px;"></div>
  </header>

  <div id="chat-box">
    <div class="msg bot">CRIMSON AI prêt. Envoie ta demande.</div>
  </div>

  <div id="input-area">
    <input type="text" id="prompt-input" placeholder="Pose ta question...">
    <button id="send-btn" onclick="sendPrompt()">Envoyer</button>
  </div>

  <script>
    const recentTopics = [];

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function newChat() {
      document.getElementById('chat-box').innerHTML = '<div class="msg bot">Nouvelle session.</div>';
      toggleSidebar();
    }

    function updateRecents(topic) {
      if (!recentTopics.includes(topic)) {
        recentTopics.unshift(topic);
      }
      const container = document.getElementById('recents-container');
      container.innerHTML = '';
      recentTopics.slice(0, 8).forEach(t => {
        const item = document.createElement('div');
        item.className = 'recent-item';
        item.textContent = t;
        container.appendChild(item);
      });
    }

    // Animation de frappe progressive (typing)
    function typeWriter(element, text, speed = 20) {
      const words = text.split(' ');
      let i = 0;
      element.textContent = '';
      
      const chatBox = document.getElementById('chat-box');
      
      function type() {
        if (i < words.length) {
          element.textContent += (i === 0 ? '' : ' ') + words[i];
          i++;
          chatBox.scrollTop = chatBox.scrollHeight;
          setTimeout(type, speed);
        }
      }
      type();
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chat-box');

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);
      input.value = '';

      updateRecents(text);

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.textContent = "Réflexion...";
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();

        if (data.reply) {
          typeWriter(botMsg, data.reply);
        } else {
          botMsg.textContent = "Erreur de réponse du serveur.";
        }

      } catch (err) {
        botMsg.textContent = "Erreur réseau avec le serveur.";
      }
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendPrompt();
    });
  </script>
</body>
</html>
