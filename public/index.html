<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRIMSON AI</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a0003 0%, #050505 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease-out, visibility 0.6s;
    }

    .splash-logo {
      font-size: 2.4rem;
      font-weight: 900;
      color: #ff1e27;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 30, 39, 0.8);
      animation: crimsonPulse 1.8s infinite ease-in-out;
    }

    .splash-sub {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #777;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @keyframes crimsonPulse {
      0% { transform: scale(0.97); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; text-shadow: 0 0 30px rgba(255, 30, 39, 1); }
      100% { transform: scale(0.97); opacity: 0.8; }
    }

    /* Main UI */
    header { background: #0f0203; border-bottom: 1px solid #330000; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .menu-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; }
    header h1 { color: #ff1e27; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; }

    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; }
    #sidebar-overlay.active { display: block; }
    
    #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0a0a0a; border-right: 1px solid #222; z-index: 201; transition: left 0.25s ease-out; display: flex; flex-direction: column; padding: 16px 12px; }
    #sidebar.active { left: 0; }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .sidebar-title { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .close-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }

    .menu-item { padding: 10px 12px; border-radius: 8px; color: #ddd; font-size: 0.9rem; cursor: pointer; }
    .section-title { font-size: 0.75rem; color: #666; text-transform: uppercase; font-weight: bold; margin: 12px 12px 6px; }
    .recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .recent-item { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .sidebar-footer { border-top: 1px solid #1f1f1f; padding-top: 12px; margin-top: auto; display: flex; align-items: center; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ff1e27; border: 1px solid #ff1e27; font-size: 0.8rem; margin-right: 10px; }
    .user-name { font-size: 0.88rem; font-weight: 600; color: #eee; }

    /* Chat Messages */
    #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }

    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; font-size: 0.92rem; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; transition: all 0.2s ease-in-out; }
    .user { align-self: flex-end; background: #990000; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #121212; border: 1px solid #2a0808; color: #e0e0e0; border-bottom-left-radius: 2px; }

    .chat-img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-bottom: 8px; display: block; object-fit: cover; }

    /* Preview section before sending */
    #preview-area { display: none; padding: 8px 14px; background: #0f0203; border-top: 1px solid #220000; align-items: center; gap: 10px; }
    #preview-thumb { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; border: 1px solid #ff1e27; }
    #remove-img-btn { background: none; border: none; color: #ff1e27; font-weight: bold; cursor: pointer; font-size: 1rem; margin-left: auto; }

    /* Input area */
    #input-area { background: #0f0203; padding: 10px 12px; border-top: 1px solid #220000; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    #file-btn { background: none; border: none; color: #aaa; font-size: 1.3rem; cursor: pointer; padding: 0 6px; }
    #file-btn:active { color: #ff1e27; }
    #prompt-input { flex: 1; background: #121212; border: 1px solid #330000; border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; font-size: 0.92rem; }
    #prompt-input:focus { border-color: #ff1e27; }
    #send-btn { background: #cc0000; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    #send-btn:active { background: #ff1e27; }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="splash-logo">CRIMSON AI</div>
    <div class="splash-sub">Initialisation du système...</div>
  </div>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CRIMSON</span>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="menu-item" onclick="newChat()">✏️ Nouvelle discussion</div>
    <div class="section-title">Récents</div>
    <div class="recents-list" id="recents-container"></div>

    <div class="sidebar-footer">
      <div class="avatar">BS</div>
      <span class="user-name">Brayan Slyde</span>
    </div>
  </div>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h1>CRIMSON AI</h1>
    <div style="width: 24px;"></div>
  </header>

  <div id="chat-box">
    <div class="msg bot">CRIMSON AI est opérationnel. Que faisons-nous ?</div>
  </div>

  <div id="preview-area">
    <img id="preview-thumb" src="" alt="Image">
    <span style="font-size: 0.8rem; color: #aaa;">Image sélectionnée</span>
    <button id="remove-img-btn" onclick="removeImage()">✕</button>
  </div>

  <div id="input-area">
    <button id="file-btn" onclick="document.getElementById('image-input').click()">📎</button>
    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
    <input type="text" id="prompt-input" placeholder="Pose ta question...">
    <button id="send-btn" onclick="sendPrompt()">Envoyer</button>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 600);
      }, 1500);
    });

    const recentTopics = [];
    let selectedBase64 = null;
    let selectedMimeType = null;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function newChat() {
      document.getElementById('chat-box').innerHTML = '<div class="msg bot">Nouvelle session.</div>';
      toggleSidebar();
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(e) {
        const fullBase64 = e.target.result;
        selectedBase64 = fullBase64.split(',')[1];
        document.getElementById('preview-thumb').src = fullBase64;
        document.getElementById('preview-area').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function removeImage() {
      selectedBase64 = null;
      selectedMimeType = null;
      document.getElementById('image-input').value = '';
      document.getElementById('preview-area').style.display = 'none';
    }

    function streamText(element, fullText) {
      let index = 0;
      element.textContent = '';
      const chatBox = document.getElementById('chat-box');

      const interval = setInterval(() => {
        if (index < fullText.length) {
          element.textContent += fullText.charAt(index);
          index++;
          chatBox.scrollTop = chatBox.scrollHeight;
        } else {
          clearInterval(interval);
        }
      }, 10);
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();

      if (!text && !selectedBase64) return;

      const chatBox = document.getElementById('chat-box');

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';

      if (selectedBase64) {
        const img = document.createElement('img');
        img.src = `data:${selectedMimeType};base64,${selectedBase64}`;
        img.className = 'chat-img-preview';
        userMsg.appendChild(img);
      }

      if (text) {
        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        userMsg.appendChild(textSpan);
      }

      chatBox.appendChild(userMsg);

      const payload = {
        prompt: text,
        imageBase64: selectedBase64,
        mimeType: selectedMimeType
      };

      input.value = '';
      removeImage();

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.textContent = "Analyse...";
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.reply) {
          streamText(botMsg, data.reply);
        } else {
          botMsg.textContent = "Erreur: " + (data.error || "Erreur lors du traitement.");
        }

      } catch (err) {
        botMsg.textContent = "Erreur réseau avec le serveur.";
      }
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendPrompt();
    });
  </script>
</body>
</html>
