<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRIMSON AI</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* --- SPLASH SCREEN AVANCÉ --- */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a0003 0%, #050505 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    .splash-container {
      text-align: center;
      position: relative;
    }

    .splash-logo {
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff1e27;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 30, 39, 0.8), 0 0 30px rgba(255, 30, 39, 0.4);
      animation: crimsonGlow 2s infinite alternate ease-in-out;
    }

    .splash-bar {
      width: 140px;
      height: 3px;
      background: #220004;
      margin: 18px auto 10px;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .splash-bar-fill {
      width: 100%;
      height: 100%;
      background: #ff1e27;
      box-shadow: 0 0 8px #ff1e27;
      animation: loadingBar 1.8s ease-in-out infinite;
    }

    .splash-sub {
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes crimsonGlow {
      0% { transform: scale(0.96); filter: drop-shadow(0 0 5px rgba(255, 30, 39, 0.4)); }
      100% { transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(255, 30, 39, 0.9)); }
    }

    @keyframes loadingBar {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(100%); }
    }

    /* --- INTERFACE DE CHAT --- */
    header { background: #0f0203; border-bottom: 1px solid #330000; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .menu-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 4px; }
    header h1 { color: #ff1e27; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; }

    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; }
    #sidebar-overlay.active { display: block; }
    
    #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0a0a0a; border-right: 1px solid #222; z-index: 201; transition: left 0.25s ease-out; display: flex; flex-direction: column; padding: 16px 12px; }
    #sidebar.active { left: 0; }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
    .sidebar-title { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .close-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }

    .menu-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #ddd; font-size: 0.9rem; cursor: pointer; }
    .menu-item:active { background: #1a1a1a; }

    .section-title { font-size: 0.75rem; color: #666; text-transform: uppercase; font-weight: bold; margin: 12px 12px 6px; }

    .recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .recent-item { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

    .sidebar-footer { border-top: 1px solid #1f1f1f; padding-top: 12px; margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ff1e27; border: 1px solid #ff1e27; font-size: 0.8rem; }
    .user-name { font-size: 0.88rem; font-weight: 600; color: #eee; }

    #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }

    .msg { max-width: 88%; padding: 12px 16px; border-radius: 12px; font-size: 0.92rem; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #990000; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #121212; border: 1px solid #2a0808; color: #e0e0e0; border-bottom-left-radius: 2px; }

    .cursor { display: inline-block; width: 6px; height: 14px; background: #ff1e27; margin-left: 3px; animation: blink 0.8s infinite; vertical-align: middle; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #input-area { background: #0f0203; padding: 10px 12px; border-top: 1px solid #220000; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    #prompt-input { flex: 1; background: #121212; border: 1px solid #330000; border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; font-size: 0.92rem; }
    #prompt-input:focus { border-color: #ff1e27; }
    #send-btn { background: #cc0000; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; }
    #send-btn:active { background: #ff1e27; }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN ANIMÉ -->
  <div id="splash-screen">
    <div class="splash-container">
      <div class="splash-logo">CRIMSON AI</div>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
      <div class="splash-sub">CONNEXION AU SYSTÈME...</div>
    </div>
  </div>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CRIMSON</span>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="menu-list">
      <div class="menu-item" onclick="newChat()">
        <span>✏️ Nouvelle discussion</span>
      </div>
    </div>

    <div class="section-title">Récents</div>
    <div class="recents-list" id="recents-container"></div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">BS</div>
        <span class="user-name">Brayan Slyde</span>
      </div>
    </div>
  </div>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h1>CRIMSON AI</h1>
    <div style="width: 24px;"></div>
  </header>

  <div id="chat-box">
    <div class="msg bot">CRIMSON AI initialisé. Que veux-tu savoir ?</div>
  </div>

  <div id="input-area">
    <input type="text" id="prompt-input" placeholder="Pose ta question...">
    <button id="send-btn" onclick="sendPrompt()">Envoyer</button>
  </div>

  <script>
    // Disparition fluide du splash screen
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 800);
      }, 1800);
    });

    const recentTopics = [];

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function newChat() {
      document.getElementById('chat-box').innerHTML = '<div class="msg bot">Nouvelle session initialisée.</div>';
      toggleSidebar();
    }

    function updateRecents(topic) {
      if (!recentTopics.includes(topic)) {
        recentTopics.unshift(topic);
      }
      const container = document.getElementById('recents-container');
      container.innerHTML = '';
      recentTopics.slice(0, 8).forEach(t => {
        const item = document.createElement('div');
        item.className = 'recent-item';
        item.textContent = t;
        container.appendChild(item);
      });
    }

    // Effet d'écriture caractère par caractère direct et fluide
    function animateText(element, fullText, callback) {
      let index = 0;
      element.innerHTML = '';
      
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      element.appendChild(cursor);

      const chatBox = document.getElementById('chat-box');

      const timer = setInterval(() => {
        if (index < fullText.length) {
          cursor.before(fullText.charAt(index));
          index++;
          chatBox.scrollTop = chatBox.scrollHeight;
        } else {
          clearInterval(timer);
          cursor.remove();
          if (callback) callback();
        }
      }, 12);
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chat-box');

      // Message utilisateur
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);

      input.value = '';
      updateRecents(text);

      // Message bot temporaire (chargement)
      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.textContent = "Analyse en cours...";
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();

        if (res.ok && data.reply) {
          animateText(botMsg, data.reply);
        } else {
          botMsg.textContent = "Erreur: " + (data.error || "Réponse invalide du serveur.");
        }

      } catch (err) {
        botMsg.textContent = "Erreur réseau : impossible de joindre le serveur.";
      }
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendPrompt();
    });
  </script>
</body>
</html>
