<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRIMSON AI</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #050505; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #0f0203; border-bottom: 1px solid #330000; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .menu-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 4px; }
    header h1 { color: #ff1e27; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 800; }

    #sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; }
    #sidebar-overlay.active { display: block; }
    
    #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0a0a0a; border-right: 1px solid #222; z-index: 201; transition: left 0.25s ease-out; display: flex; flex-direction: column; padding: 16px 12px; }
    #sidebar.active { left: 0; }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
    .sidebar-title { font-size: 1.1rem; font-weight: bold; color: #fff; }
    .close-btn { background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; }

    .menu-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #ddd; font-size: 0.9rem; cursor: pointer; text-decoration: none; }
    .menu-item:active { background: #1a1a1a; }
    .menu-icon { font-size: 1.1rem; width: 20px; text-align: center; color: #aaa; }

    .section-title { font-size: 0.75rem; color: #666; text-transform: uppercase; font-weight: bold; margin: 12px 12px 6px; }

    .recents-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .recent-item { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .recent-item:active { background: #1a1a1a; }

    .sidebar-footer { border-top: 1px solid #1f1f1f; padding-top: 12px; margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ff1e27; border: 1px solid #ff1e27; font-size: 0.8rem; }
    .user-name { font-size: 0.88rem; font-weight: 600; color: #eee; }

    #chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }

    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.92rem; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background: #990000; color: #fff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #141414; border: 1px solid #2a0808; color: #ddd; border-bottom-left-radius: 2px; }
    .bot img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid #333; }

    #input-area { background: #0f0203; padding: 10px; border-top: 1px solid #220000; display: flex; gap: 8px; align-items: center; flex-shrink: 0; position: relative; }
    .attach-btn { background: #1a0506; border: 1px solid #4a0000; color: #ff1e27; font-size: 1.2rem; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    #prompt-input { flex: 1; background: #121212; border: 1px solid #330000; border-radius: 20px; padding: 10px 14px; color: #fff; outline: none; font-size: 0.9rem; }
    #send-btn { background: #cc0000; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }

    #action-drawer { display: none; position: absolute; bottom: 60px; left: 0; right: 0; background: #111111; border-top: 1px solid #330000; border-radius: 20px 20px 0 0; padding: 16px; box-shadow: 0 -5px 25px rgba(0,0,0,0.8); z-index: 100; flex-direction: column; gap: 15px; }
    #action-drawer.active { display: flex; }
    .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.72rem; color: #aaa; cursor: pointer; }
    .action-icon { width: 50px; height: 50px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #fff; }
    .action-list { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #222; padding-top: 12px; }
    .list-item { display: flex; align-items: center; gap: 12px; color: #ddd; font-size: 0.88rem; cursor: pointer; }
    .list-item-icon { font-size: 1.2rem; color: #ff1e27; width: 24px; text-align: center; }
    .list-item-text span { display: block; font-size: 0.7rem; color: #666; }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CRIMSON</span>
      <button class="close-btn" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="menu-list">
      <div class="menu-item" onclick="newChat()">
        <span class="menu-icon">✏️</span>
        <span>Nouvelle discussion</span>
      </div>
    </div>

    <div class="section-title">Récents</div>
    <div class="recents-list" id="recents-container">
      <!-- Généré dynamiquement selon l'activité de la session -->
    </div>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">BS</div>
        <span class="user-name">Brayan Slyde</span>
      </div>
    </div>
  </div>

  <header>
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <h1>CRIMSON AI</h1>
    <div style="width: 24px;"></div>
  </header>

  <div id="chat-box">
    <div class="msg bot">Session prête. Envoie ton prompt ou ta commande.</div>
  </div>

  <div id="action-drawer">
    <div class="action-grid">
      <div class="action-item" onclick="selectAction('Image')"><div class="action-icon">🖼️</div><span>Image</span></div>
      <div class="action-item" onclick="selectAction('Fichiers')"><div class="action-icon">📎</div><span>Fichiers</span></div>
    </div>
  </div>

  <div id="input-area">
    <button class="attach-btn" onclick="toggleDrawer()">+</button>
    <input type="text" id="prompt-input" placeholder="Message ou demande d'image...">
    <button id="send-btn" onclick="sendPrompt()">Envoyer</button>
  </div>

  <script>
    const conversationHistory = [];
    const recentTopics = [];

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar && overlay) {
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
      }
    }

    function toggleDrawer() {
      const drawer = document.getElementById('action-drawer');
      if (drawer) {
        drawer.classList.toggle('active');
      }
    }

    function selectAction(name) {
      const input = document.getElementById('prompt-input');
      input.value = '/image ';
      toggleDrawer();
      input.focus();
    }

    function newChat() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '<div class="msg bot">Nouvelle session lancée.</div>';
      conversationHistory.length = 0;
      toggleSidebar();
    }

    function updateRecents(topic) {
      recentTopics.unshift(topic);
      const container = document.getElementById('recents-container');
      container.innerHTML = '';
      recentTopics.slice(0, 10).forEach(t => {
        const item = document.createElement('div');
        item.className = 'recent-item';
        item.textContent = t;
        container.appendChild(item);
      });
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;

      document.getElementById('action-drawer').classList.remove('active');

      const chatBox = document.getElementById('chat-box');

      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);
      input.value = '';

      if (recentTopics.length === 0 || recentTopics[0] !== text) {
        updateRecents(text);
      }

      conversationHistory.push({ sender: 'user', text: text });

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.textContent = "Génération / Traitement en cours...";
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Si c'est une demande d'image
      if (text.toLowerCase().startsWith('/image') || text.toLowerCase().includes('génère une image')) {
        const promptText = text.replace(/\/image/i, '').trim();
        const cleanPrompt = encodeURIComponent(promptText || 'cyberpunk dark background');
        // Ajout d'un timestamp unique pour contourner le cache Pollinations
        const cacheBuster = Date.now();
        const imageUrl = `https://pollinations.ai/p/${cleanPrompt}?width=512&height=512&seed=${cacheBuster}&nologo=true`;

        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = promptText;
        img.onerror = () => {
          botMsg.textContent = "Erreur de chargement de l'image (limite de débit Pollinations). Réessaie dans quelques secondes.";
        };
        img.onload = () => {
          botMsg.textContent = `Image générée pour : "${promptText}"`;
          botMsg.appendChild(img);
          chatBox.scrollTop = chatBox.scrollHeight;
        };
        return;
      }

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, history: conversationHistory })
        });
        const data = await res.json();

        botMsg.textContent = data.reply || "Aucune réponse.";
        conversationHistory.push({ sender: 'bot', text: data.reply });
      } catch (err) {
        botMsg.textContent = "Erreur de connexion serveur.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('prompt-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendPrompt();
    });
  </script>
</body>
</html>
