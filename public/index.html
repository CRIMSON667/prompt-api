<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRIMSON AI</title>
  
  <!-- Configuration PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#dc143c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: #050505;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* Écran d'animation futuriste */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOutSplash 1s forwards 3s;
    }

    .orb-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .orb-core {
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #ff1a40 0%, #8b0000 70%, #000 100%);
      border-radius: 50%;
      box-shadow: 0 0 35px #dc143c, inset 0 0 15px #ff4d6d;
      animation: pulseCore 1.5s ease-in-out infinite alternate;
    }

    .orb-ring {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 2px solid transparent;
      border-top-color: #dc143c;
      border-right-color: rgba(220, 20, 60, 0.3);
      border-radius: 50%;
      animation: rotateRing 2s linear infinite;
    }

    .orb-ring-outer {
      position: absolute;
      width: 115px;
      height: 115px;
      border: 1px dashed rgba(220, 20, 60, 0.6);
      border-radius: 50%;
      animation: rotateRingReverse 4s linear infinite;
    }

    @keyframes pulseCore {
      from { transform: scale(0.9); box-shadow: 0 0 20px #dc143c; }
      to { transform: scale(1.1); box-shadow: 0 0 45px #ff1a40, 0 0 10px #ffffff; }
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .splash-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #dc143c;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(220, 20, 60, 0.9);
    }

    .splash-sub {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    @keyframes fadeOutSplash {
      to { opacity: 0; visibility: hidden; }
    }

    /* Structure Principale */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    header {
      background: linear-gradient(180deg, #150303 0%, #050505 100%);
      padding: 14px 18px;
      text-align: center;
      border-bottom: 1px solid #2a0808;
      box-shadow: 0 4px 20px rgba(220, 20, 60, 0.15);
      flex-shrink: 0;
    }

    header h1 {
      color: #dc143c;
      font-size: 1.3rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
    }

    header p {
      font-size: 0.72rem;
      color: #777;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #7a0000 0%, #b30000 100%);
      color: #ffffff;
      border-bottom-right-radius: 2px;
      box-shadow: 0 3px 12px rgba(179, 0, 0, 0.3);
    }

    .ai {
      align-self: flex-start;
      background-color: #111111;
      color: #e0e0e0;
      border: 1px solid #262626;
      border-left: 3px solid #dc143c;
      border-bottom-left-radius: 2px;
    }

    .ai img, .user img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid #333;
    }

    .error-msg {
      align-self: center;
      background-color: rgba(220, 20, 60, 0.1);
      border: 1px solid #dc143c;
      color: #ff6b6b;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    #input-container {
      padding: 10px 12px;
      background-color: #0d0d0d;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    #prompt {
      flex: 1;
      background-color: #161616;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    #prompt:focus {
      border-color: #dc143c;
    }

    .file-btn {
      background: #1c1c1c;
      border: 1px solid #333;
      color: #aaa;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .file-btn:active {
      background: #2a2a2a;
    }

    button.send-btn {
      background: linear-gradient(135deg, #8b0000 0%, #dc143c 100%);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 3px 10px rgba(220, 20, 60, 0.3);
      flex-shrink: 0;
    }

    button.send-btn:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #preview-container {
      display: none;
      padding: 6px 12px;
      background: #0d0d0d;
      border-top: 1px solid #1f1f1f;
      align-items: center;
      gap: 10px;
    }

    #preview-img {
      height: 40px;
      border-radius: 6px;
      border: 1px solid #dc143c;
    }

    .remove-img {
      color: #ff4d4d;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #chat-container::-webkit-scrollbar {
      width: 4px;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background-color: #333;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="orb-container">
      <div class="orb-ring-outer"></div>
      <div class="orb-ring"></div>
      <div class="orb-core"></div>
    </div>
    <div class="splash-title">CRIMSON AI</div>
    <div class="splash-sub">CONNEXION NEURONALE...</div>
  </div>

  <div id="app-container">
    <header>
      <h1>CRIMSON AI</h1>
      <p>CONSEILLER TACTIQUE // GENERATEUR & ANALYSTE</p>
    </header>

    <div id="chat-container">
      <div class="message ai">Montre-moi ce que tu vaux, Brayan. Ne me fais pas perdre mon temps.</div>
    </div>

    <div id="preview-container">
      <img id="preview-img" src="" alt="Aperçu">
      <span class="remove-img" onclick="clearImage()">✕ Supprimer</span>
    </div>

    <div id="input-container">
      <label class="file-btn" for="image-input">
        📷
      </label>
      <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
      
      <input type="text" id="prompt" placeholder="Message ou demande d'image..." autocomplete="off" onkeydown="if(event.key==='Enter') sendPrompt()">
      <button class="send-btn" id="send-btn" onclick="sendPrompt()">Envoyer</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }

    let selectedImageBase64 = null;

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result;
        document.getElementById('preview-img').src = selectedImageBase64;
        document.getElementById('preview-container').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImageBase64 = null;
      document.getElementById('image-input').value = '';
      document.getElementById('preview-container').style.display = 'none';
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('send-btn');
      const chat = document.getElementById('chat-container');
      const text = input.value.trim();

      if (!text && !selectedImageBase64) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      
      if (text) {
        const p = document.createElement('p');
        p.textContent = text;
        userDiv.appendChild(p);
      }

      if (selectedImageBase64) {
        const img = document.createElement('img');
        img.src = selectedImageBase64;
        userDiv.appendChild(img);
      }

      chat.appendChild(userDiv);

      const currentImage = selectedImageBase64;
      input.value = '';
      clearImage();
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'message ai';
      loadingDiv.textContent = 'Traitement tactique en cours...';
      chat.appendChild(loadingDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, image: currentImage })
        });
        const data = await res.json();
        
        loadingDiv.innerHTML = '';

        if (data.reply) {
          const textNode = document.createElement('div');
          textNode.innerHTML = data.reply.replace(/\n/g, '<br>');
          loadingDiv.appendChild(textNode);
        }

        if (data.imageUrl) {
          const generatedImg = document.createElement('img');
          generatedImg.src = data.imageUrl;
          loadingDiv.appendChild(generatedImg);
        }

        if (!data.reply && !data.imageUrl) {
          loadingDiv.textContent = "Tch. Aucune donnée exploitable.";
        }
      } catch (err) {
        loadingDiv.className = 'message error-msg';
        loadingDiv.textContent = "Erreur système. Connexion interrompue.";
      } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }
  </script>
</body>
</html>
