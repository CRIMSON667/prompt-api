<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIMSON AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d0d0d; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1a0000; border-bottom: 2px solid #800000; padding: 15px; text-align: center; font-size: 1.5rem; font-weight: bold; color: #ff3333; letter-spacing: 2px; }
    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background-color: #800000; color: #fff; border-bottom-right-radius: 0; }
    .bot { align-self: flex-start; background-color: #1f1f1f; color: #e0e0e0; border: 1px solid #333; border-bottom-left-radius: 0; }
    #input-container { display: flex; padding: 15px; background-color: #141414; border-top: 1px solid #262626; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background-color: #000; color: #fff; outline: none; }
    input:focus { border-color: #800000; }
    button { padding: 12px 24px; background-color: #800000; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #b30000; }
  </style>
</head>
<body>
  <header>CRIMSON AI</header>
  <div id="chat-box">
    <div class="message bot">Salut, je suis CRIMSON AI. Que veux-tu savoir ?</div>
  </div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="Pose une question..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Envoyer</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const prompt = input.value.trim();
      if (!prompt) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = prompt;
      chatBox.appendChild(userMsg);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      botMsg.textContent = 'Réflexion en cours...';
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        botMsg.textContent = data.reply || data.error || "Erreur de réponse.";
      } catch (e) {
        botMsg.textContent = "Erreur de connexion au serveur.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
